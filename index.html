<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오늘은 어떤 날인가요? | aria 맞춤 가이드</title>
<meta name="description" content="웨스틴 조선 서울 아리아 맞춤 예약 가이드 (KNDA 고객경험 워크숍 프로토타입)" />
<meta property="og:title" content="오늘은 어떤 날인가요? | aria 맞춤 가이드" />
<meta property="og:description" content="세 가지만 알려주시면, 그날에 필요한 아리아 안내만 모아드릴게요." />
<meta property="og:image" content="img-hall.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --cream:#F9F5F2; --paper:#FFFDFB; --sand:#E8D8CC; --sand2:#D8C6B5;
  --espresso:#16110F; --ink:#2A221D; --muted:#7A6A5D; --line:#E6DAD0;
  --caramel:#936635; --travertine:#B0946C; --red:#A3302A;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#EFE7E0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(22,17,15,.08)}
.serif{font-family:"Noto Serif KR",serif}
.wordmark{font-family:"Playfair Display",serif;font-weight:500;letter-spacing:.02em}
.screen{display:none;min-height:100vh;animation:fade .45s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* landing */
.land{position:relative;min-height:100vh;color:#fff;display:flex;flex-direction:column}
.land .bg{position:absolute;inset:0;background:url(img-hall.jpg) center/cover no-repeat}
.land .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,17,15,.55) 0%,rgba(22,17,15,.25) 35%,rgba(22,17,15,.85) 72%,#16110F 100%)}
.land .top{position:relative;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.land .body{position:relative;margin-top:auto;padding:0 26px 34px}
.land .logo{font-size:64px;line-height:1;margin-bottom:6px}
.land .sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sand);margin-bottom:28px}
.land h1{font-size:28px;font-weight:600;line-height:1.35;margin-bottom:12px}
.land p{font-size:15px;color:#E9DED5;margin-bottom:28px}
.keys{display:flex;gap:6px;margin-bottom:26px}
.keys span{height:22px;flex:1;border-radius:3px;background:rgba(255,255,255,.12)}
.keys span:nth-child(2n){background:rgba(176,148,108,.45);flex:.6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--travertine);color:var(--espresso)}
.btn.dark{background:var(--espresso);color:#fff}
.btn.line{border:1px solid var(--sand2);color:var(--ink);background:var(--paper)}
.meta{margin-top:14px;font-size:12px;color:#BFAFA2;text-align:center}

/* questions */
.qwrap{padding:22px 22px 30px;min-height:100vh;display:flex;flex-direction:column}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper)}
.prog{display:flex;gap:6px}
.prog i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--caramel)}
.qnum{font-family:"Playfair Display",serif;font-style:italic;color:var(--caramel);font-size:15px;margin-bottom:6px}
.qtitle{font-size:26px;font-weight:600;line-height:1.35;margin-bottom:8px}
.qsub{color:var(--muted);font-size:14px;margin-bottom:24px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 16px;border-radius:var(--radius);background:var(--paper);border:1px solid var(--line);transition:all .18s}
.opt:hover{border-color:var(--travertine)}
.opt.sel{border-color:var(--caramel);background:#FBF3EB;box-shadow:0 0 0 1px var(--caramel) inset}
.opt .ic{width:46px;height:46px;flex:none;border-radius:14px;background:var(--cream);display:grid;place-items:center;font-size:22px}
.opt b{display:block;font-size:16px;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.qfoot{margin-top:auto;padding-top:24px;font-size:12px;color:var(--muted);text-align:center}

/* result */
.rhero{position:relative;color:#fff;padding:22px 22px 26px;background:var(--espresso);overflow:hidden}
.rhero .ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42}
.rhero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,17,15,.2),#16110F 92%)}
.rhero .in{position:relative}
.rtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}
.rtop .wordmark{font-size:28px}
.redo{font-size:12px;padding:7px 12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(176,148,108,.25);color:#F3E7DC;border:1px solid rgba(176,148,108,.5)}
.rhero h2{font-size:24px;line-height:1.38;font-weight:600;margin-bottom:8px}
.rhero p{font-size:14px;color:#D9CCC1}

.nav{position:sticky;top:0;z-index:5;background:rgba(249,245,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;font-size:13px;text-decoration:none;padding:7px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.nav a.on{background:var(--espresso);color:#fff;border-color:var(--espresso)}

.sec{padding:26px 18px 6px;scroll-margin-top:56px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-h .n{font-family:"Playfair Display",serif;font-style:italic;color:var(--caramel);font-size:15px}
.sec-h h3{font-size:20px;font-weight:600}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.card.dark{background:var(--espresso);color:#F3EAE2;border-color:var(--espresso)}
.card.dark .muted{color:#BFAFA2}
.card h4{font-size:16px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card p,.card li{font-size:14px}
.card ul{list-style:none;display:grid;gap:9px}
.card li{position:relative;padding-left:14px}
.card li::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--travertine)}
.muted{color:var(--muted)}
.small{font-size:12px}
.pic{border-radius:14px;overflow:hidden;margin:-4px 0 14px;aspect-ratio:16/9;background:var(--sand)}
.pic img{width:100%;height:100%;object-fit:cover}
.cap{font-size:11px;color:var(--muted);margin:-8px 0 14px}
.src{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.src.o{background:#EFE3D3;color:#7A5426}
.src.c{background:#FCE9DE;color:#B4501F}
.src.v{background:#E3F3E6;color:#22783A}
.src.r{background:#EAE6F4;color:#5A4A8C}
.src.d{background:rgba(255,255,255,.14);color:#F3E7DC}

.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.glance div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px}
.glance div.w{grid-column:1/-1}
.glance small{display:block;font-size:11px;letter-spacing:.06em;color:#BFAFA2;margin-bottom:4px}
.glance b{font-size:15px;font-weight:600;line-height:1.4;display:block}
.glance em{font-style:normal;font-size:12px;color:#D9CCC1;display:block;margin-top:3px}

table.price{width:100%;border-collapse:collapse;font-size:14px}
table.price th,table.price td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}
table.price th{font-weight:500;color:var(--muted);font-size:12px}
table.price td.r{text-align:right;font-variant-numeric:tabular-nums}
table.price td.hl{color:var(--red);font-weight:600}
table.price tr.mine td{background:#FBF3EB}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--red);color:#fff}
.tag.g{background:var(--caramel)}
.tip{display:flex;gap:12px;padding:14px;border-radius:14px;background:#FBF3EB;border:1px dashed var(--travertine);margin-bottom:10px}
.tip .q{flex:none;width:30px;height:30px;border-radius:50%;background:var(--caramel);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.tip p{font-size:14px}
.tip b{display:block;font-size:14px;margin-bottom:2px}
.steps{counter-reset:s;display:grid;gap:8px}
.steps li{counter-increment:s;padding-left:30px}
.steps li::before{content:counter(s);background:var(--espresso);color:#fff;width:20px;height:20px;border-radius:50%;top:.15em;font-size:11px;display:grid;place-items:center;font-weight:600}
.hide{display:none!important}

.cta{padding:26px 18px 20px}
.cta .card{padding:20px}
.cta .btn{margin-top:10px}
.cta .btn small{font-weight:400;font-size:12px;opacity:.8}
.foot{padding:10px 22px 40px;font-size:11.5px;color:var(--muted);line-height:1.7}
.foot b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--espresso);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">

  <!-- 0. 랜딩 -->
  <section class="screen on" id="s-land">
    <div class="land">
      <div class="bg" role="img" aria-label="아리아 홀 전경"></div>
      <div class="top"><span>The Westin Josun Seoul</span><span>Since 1914</span></div>
      <div class="body">
        <div class="logo wordmark">aria</div>
        <div class="sub">Symphony of Flavors · 세계 미식의 하모니</div>
        <h1 class="serif">오늘은<br />어떤 날인가요?</h1>
        <p>세 가지만 알려주시면, 그날에 꼭 필요한<br />아리아 안내만 한 장에 모아드릴게요.</p>
        <div class="keys" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <button class="btn gold" id="start">맞춤 가이드 시작하기 →</button>
        <div class="meta">질문 3개 · 약 20초 · 개인정보를 묻지 않아요</div>
      </div>
    </div>
  </section>

  <!-- 1~3. 질문 -->
  <section class="screen" id="s-q">
    <div class="qwrap">
      <div class="qhead">
        <button class="back" id="qback" aria-label="이전">←</button>
        <div class="prog" id="prog"><i></i><i></i><i></i></div>
        <span class="wordmark" style="font-size:20px">aria</span>
      </div>
      <div id="qbody"></div>
      <div class="qfoot">답변은 가이드를 만드는 데만 쓰이고 저장되지 않아요.</div>
    </div>
  </section>

  <!-- 4. 결과 -->
  <section class="screen" id="s-r">
    <div class="rhero">
      <div class="ph" id="rph"></div>
      <div class="in">
        <div class="rtop"><span class="wordmark">aria</span><button class="redo" id="redo">답변 바꾸기</button></div>
        <div class="chips" id="rchips"></div>
        <h2 class="serif" id="rtitle"></h2>
        <p id="rlead"></p>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#g0">한눈에</a><a href="#g1">할인 혜택</a><a href="#g2">시즌 메뉴</a><a href="#g3">오시는 길</a><a href="#g4">추가 제안</a><a href="#g5">예약 전 체크</a><a href="#g6">예약하기</a>
    </nav>
    <div id="rbody"></div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
   정보 확인일: 2026-10-19
   출처 배지: 공식(조선호텔 공식 아리아 예약 페이지·이벤트 페이지) / 캐치테이블 / 네이버(플레이스·예약) / 후기(팀 리뷰 분석)
   ========================================================= */
const TODAY = new Date();
const OCT_PROMO_END = new Date('2026-10-30T23:59:59+09:00');
const promoOn = TODAY <= OCT_PROMO_END;

const S = { o:'<span class="src o">공식</span>', c:'<span class="src c">캐치테이블</span>', v:'<span class="src v">네이버</span>', r:(n)=>`<span class="src r">후기${n?' '+n:''}</span>` };

const LINKS = {
  catch:'https://app.catchtable.co.kr/ct/shop/aria',
  naver:'https://booking.naver.com/booking/6/bizes/87983',
  official:'https://www.josunhotel.com/resve/dining/step0.do',
  tel:'tel:02-317-0357',
  map:'https://map.naver.com/p/entry/place/11714851',
  deli:'https://booking.naver.com/booking/6/bizes/535356',
  pkg:'https://www.josunhotel.com/package/get.do?packageId=234&propertyId=2',
  autumn:'https://www.josunhotel.com/event/get.do?eventSn=2788690',
  club:'https://www.josunhotel.com/membership/ed2_product.do'
};

const Q = [
  { id:'day', n:'01', title:'오늘은 어떤 날인가요?', sub:'날에 맞는 준비물과 혜택을 먼저 보여드릴게요.', opts:[
    {v:'anniv', ic:'💍', t:'결혼·연애 기념일', d:'결혼기념일, 100일, 프러포즈'},
    {v:'bday', ic:'🎂', t:'생일', d:'연인, 친구, 나의 생일'},
    {v:'parents', ic:'🌸', t:'부모님 생신·환갑·칠순', d:'어른을 모시는 날'},
    {v:'gather', ic:'🥂', t:'가족·지인 모임', d:'특별한 날은 아니지만 좋은 한 끼'}
  ]},
  { id:'who', n:'02', title:'누구와 오시나요?', sub:'함께 오는 분에 따라 좌석과 시간 팁이 달라져요.', opts:[
    {v:'couple', ic:'👫', t:'연인·배우자와 둘이', d:'2인'},
    {v:'elders', ic:'👵', t:'부모님·어른과 함께', d:'3~8인 가족'},
    {v:'kids', ic:'🧒', t:'아이와 함께', d:'유아·초등학생 동반'},
    {v:'group', ic:'👥', t:'친구·지인 여럿', d:'3인 이상 (9인 이상 단체 포함)'}
  ]},
  { id:'go', n:'03', title:'어떻게 오시나요?', sub:'주차, 발렛, 지하철 중 내 방법에 맞춰 안내해요.', opts:[
    {v:'car', ic:'🚗', t:'자가용 · 직접 주차', d:'호텔 지하주차장'},
    {v:'valet', ic:'🔑', t:'자가용 · 발렛', d:'1층 로비 입구에서 맡기기'},
    {v:'transit', ic:'🚇', t:'지하철·버스·택시', d:'시청역, 을지로입구역'}
  ]}
];

const LABEL = {
  day:{anniv:'기념일',bday:'생일',parents:'부모님 기념일',gather:'모임'},
  who:{couple:'둘이서',elders:'어른과 함께',kids:'아이와 함께',group:'여럿이'},
  go:{car:'직접 주차',valet:'발렛',transit:'대중교통'}
};

let A = {}; let qi = 0;
const $ = (s)=>document.querySelector(s);
function show(id){ document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on', e.id===id)); window.scrollTo(0,0); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }

function renderQ(){
  const q = Q[qi];
  document.querySelectorAll('#prog i').forEach((e,i)=>e.classList.toggle('on', i<=qi));
  $('#qbody').innerHTML = `
    <div class="qnum">Question ${q.n} / 03</div>
    <h2 class="qtitle serif">${q.title}</h2>
    <p class="qsub">${q.sub}</p>
    <div class="opts">${q.opts.map(o=>`
      <button class="opt ${A[q.id]===o.v?'sel':''}" data-v="${o.v}">
        <span class="ic">${o.ic}</span><span><b>${o.t}</b><small>${o.d}</small></span>
      </button>`).join('')}</div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    A[q.id]=b.dataset.v; b.classList.add('sel');
    setTimeout(()=>{ if(qi<Q.length-1){ qi++; renderQ(); window.scrollTo(0,0);} else { renderResult(); } },220);
  });
}

/* ---------- 결과 조립 ---------- */
function won(n){ return n.toLocaleString('ko-KR')+'원'; }

function titleFor(a){
  const t = {
    anniv:{couple:'두 분의 기념일을 위한<br>아리아 가이드', elders:'가족과 함께하는 기념일,<br>아리아 가이드', kids:'아이와 함께하는 기념일,<br>아리아 가이드', group:'함께 축하하는 기념일,<br>아리아 가이드'},
    bday:{couple:'둘만의 생일 저녁을 위한<br>아리아 가이드', elders:'어른과 함께하는 생일,<br>아리아 가이드', kids:'아이와 함께하는 생일 파티,<br>아리아 가이드', group:'다 함께 축하하는 생일,<br>아리아 가이드'},
    parents:{couple:'부모님 두 분을 모시는 날,<br>아리아 가이드', elders:'부모님을 모시는 특별한 날,<br>아리아 가이드', kids:'삼대가 함께하는 잔칫날,<br>아리아 가이드', group:'온 가족이 모이는 잔칫날,<br>아리아 가이드'},
    gather:{couple:'둘이 즐기는 미식의 하루,<br>아리아 가이드', elders:'가족 식사를 위한<br>아리아 가이드', kids:'아이와 함께하는 주말 한 끼,<br>아리아 가이드', group:'모임을 위한<br>아리아 가이드'}
  };
  return t[a.day][a.who];
}

        <li>그래도 예약 요청사항에 "${LABEL.day[a.day]}, 창가 희망"을 남겨 창가를 받았다는 후기가 많아요 ${S.r('창가 언급 84건')}</li>
        <li>당일 예약은 창가를 못 받았다는 후기가 있어요. <b>예약이 열리는 날(매월 1일 9시)</b>에 빨리 잡을수록 유리해요</li>
      </ul>
    </div>`;
  const kids = `
    <div class="card" data-k="kids">
      <h4>🧸 아이 준비물 ${S.c}</h4>
      <ul>
        <li>캐치테이블 편의시설에 <b>웰컴키즈존</b>으로 등록돼 있어요</li>
        <li>요청사항에 "아기 동반"을 남기면 유아의자, 유아식기, 아기가위까지 미리 세팅해 줬다는 후기가 있어요 ${S.r()}</li>
        <li>로비에 수유실이 있다는 후기도 있어요 ${S.r()}</li>
      </ul>
    </div>`;
  const room = `
    <div class="card" data-k="room">
      <h4>🚪 별실(룸) ${S.o}${S.c}</h4>
      <ul>
        <li>별실 3개: 6~8인 2개, 8~10인 1개 · 룸 차지 <b>50,000원</b></li>
        <li>최소 주문금액 6~8인 1,050,000원 / 8~10인 1,400,000원 (평일 저녁·주말 기준)</li>
        <li>환갑·칠순 잔치를 룸에서 했다는 후기가 많아요 ${S.r()}</li>
        <li>9인 이상 단체와 룸은 <b>전화 예약</b>만 돼요: 02-317-0357</li>
      </ul>
    </div>`;
  let order;
  if(a.who==='kids') order = [kids, cake, seat, ...(a.day==='parents'?[room]:[]), flower, wine];
  else if(a.day==='parents' || a.who==='elders') order = [room, seat, flower, cake, wine];
  else if(a.who==='group') order = [room, wine, cake, seat];
  else if(a.day==='anniv') order = [wine, flower, cake, seat];
  else if(a.day==='bday') order = [cake, flower, wine, seat];
  else order = [seat, wine, cake];
  return `
  <div class="sec" id="g4">
    <div class="sec-h"><span class="n">04</span><h3>추가 제안</h3></div>
    <p class="muted small" style="margin:-6px 4px 12px">${LABEL.day[a.day]} · ${LABEL.who[a.who]}에 맞춰 필요한 순서대로 보여드려요.</p>
    ${order.join('')}
  </div>`;
}

function renderResult(){
  const a = A;
  $('#rph').style.backgroundImage = `url(${a.who==='couple'?'img-window.jpg':a.who==='kids'?'img-dessert.jpg':a.who==='group'?'img-asian.jpg':'img-hall.jpg'})`;
  $('#rchips').innerHTML = ['day','who','go'].map(k=>`<span class="chip">${LABEL[k][a[k]]}</span>`).join('');
  $('#rtitle').innerHTML = titleFor(a);
  $('#rlead').textContent = '흩어진 공식 정보와 실제 방문 후기에서, 오늘에 필요한 것만 골랐어요.';
  $('#rbody').innerHTML = sectionGlance(a)+sectionDiscount(a)+sectionSeason(a)+sectionWay(a)+sectionExtra(a)+sectionCheck(a)+sectionCta(a);
  show('s-r');
  const url = new URL(location.href); url.search = `?d=${a.day}&w=${a.who}&g=${a.go}`; url.hash='';
  history.replaceState(null,'',url);
  $('#share').onclick = async()=>{ try{ await navigator.clipboard.writeText(url.toString()); toast('링크를 복사했어요'); }catch(e){ toast(url.toString()); } };
  setupNav();
}

function setupNav(){
  const links=[...document.querySelectorAll('#nav a')];
  links.forEach(l=>l.onclick=(e)=>{ e.preventDefault(); document.querySelector(l.getAttribute('href')).scrollIntoView({behavior:'smooth'}); });
  const io = new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ links.forEach(l=>l.classList.toggle('on', l.getAttribute('href')==='#'+en.target.id)); const on=links.find(l=>l.classList.contains('on')); if(on){ const nv=document.getElementById('nav'); nv.scrollTo({left:on.offsetLeft-nv.clientWidth/2+on.clientWidth/2,behavior:'smooth'}); } } }); },{rootMargin:'-45% 0px -50% 0px'});
  ['g0','g1','g2','g3','g4','g5','g6'].forEach(id=>{ const el=document.getElementById(id); el&&io.observe(el); });
}

$('#start').onclick=()=>{ qi=0; A={}; renderQ(); show('s-q'); };
$('#qback').onclick=()=>{ if(qi>0){ qi--; renderQ(); } else show('s-land'); };
$('#redo').onclick=()=>{ qi=0; renderQ(); show('s-q'); history.replaceState(null,'',location.pathname); };

/* 공유 링크로 들어오면 바로 결과 */
(function(){
  const p=new URLSearchParams(location.search); const d=p.get('d'),w=p.get('w'),g=p.get('g');
  if(LABEL.day[d]&&LABEL.who[w]&&LABEL.go[g]){ A={day:d,who:w,go:g}; renderResult(); }
})();
